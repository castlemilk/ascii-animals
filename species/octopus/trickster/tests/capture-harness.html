<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Octopus exact-source capture harness</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #eee7da; background: #0b1519; font: 13px/1.4 ui-monospace, monospace; }
    header { height: 76px; padding: 14px 18px; display: flex; flex-direction: column; gap: 5px; }
    header span { color: #a8b9b9; font-size: 11px; }
    canvas { display: block; touch-action: pan-y; }
    canvas:focus-visible { outline: 2px solid #f8d5a7; outline-offset: -4px; }
    footer { min-height: 42px; padding: 11px 18px; color: #a8b9b9; font-size: 10px; }
  </style>
</head>
<body>
  <main id="capture">
    <header><strong id="title"></strong><span id="details"></span></header>
    <canvas id="animal" tabindex="0" aria-label="Octopus source capture; use the ordinary prototype for a complete interface."></canvas>
    <footer>Exact-source Chromium canvas · controlled input replay · not a live-gallery screenshot</footer>
  </main>
  <script type="module">
    const q = new URLSearchParams(location.search);
    const variant = q.get('variant') || 'baseline';
    const surface = q.get('surface') || 'study';
    const width = Number(q.get('width') || 960), height = Number(q.get('height') || 600);
    const seed = Number(q.get('seed') || (surface === 'study' ? 17 : 7));
    const canvas = document.getElementById('animal');
    canvas.style.width = `${width}px`; canvas.style.height = `${height}px`;
    document.body.style.width = `${width}px`;
    document.getElementById('title').textContent = variant === 'baseline'
      ? `CURRENT MAIN · ${surface === 'study' ? 'Octopus Den options' : 'Gallery options'}`
      : 'ISOLATED PROPOSAL · Pocket Trickster';
    document.getElementById('details').textContent = `${width} × ${height} canvas · seed ${seed} · 60 Hz · tick 0`;
    let controller, options;
    if (variant === 'baseline') {
      const { CuttlefishArtwork } = await import('../../../../src/animals/cuttlefish.js');
      options = surface === 'study'
        ? { species: 'octopus', speciesByAnimal: [], count: 1, scene: 'reactive', formation: 'independent',
            behaviors: ['hover'], size: 1.3, sizeVariation: 0, density: 1.45, palette: 'ember', glow: false,
            seed, followPointer: true, speed: 1, autoStart: false, paused: false,
            reducedMotion: 'ignore', observeVisibility: true }
        : { species: 'octopus', seed, scene: 'reactive', count: 1, size: 1, followPointer: true,
            speed: 1, autoStart: false, paused: false, reducedMotion: 'ignore', observeVisibility: true };
      controller = new CuttlefishArtwork(canvas, options);
    } else {
      const { createOctopusTrickster } = await import('../browser.mjs');
      options = { seed, autoStart: false, paused: false, reducedMotion: 'ignore' };
      controller = createOctopusTrickster(canvas, options);
    }
    let tick = 0;
    const log = [
      { tick: 90, type: 'invite', x: .70, y: .33 },
      { tick: 280, type: 'release' },
      { tick: 360, type: 'pulse', x: -.5, y: 0 },
    ];
    function screenPoint(x, y) {
      const unit = Math.min(width * .44, height * .48), r = canvas.getBoundingClientRect();
      return { x: r.left + width * .5 + x * unit, y: r.top + height * .49 + y * unit };
    }
    function input(event) {
      if (variant === 'candidate') {
        if (event.type === 'invite') controller.invite(event.x, event.y);
        else if (event.type === 'release') controller.release();
        else if (event.type === 'pulse') controller.pulse(event.x, event.y);
      } else if (event.type === 'release') canvas.dispatchEvent(new PointerEvent('pointerleave', { pointerType: 'mouse' }));
      else {
        const point = screenPoint(event.x, event.y);
        canvas.dispatchEvent(new PointerEvent('pointermove', { clientX: point.x, clientY: point.y, pointerType: 'mouse' }));
        if (event.type === 'pulse') controller.pulse();
      }
    }
    function stats() {
      const value = controller.getStats();
      return { variant, surface, width, height, seed, tick, options, actual: value,
        ...(variant === 'baseline' ? { species: controller.fish[0]?.speciesState?.diagnostics,
          effectiveOptions: controller.options } : {}) };
    }
    function advanceTo(target) {
      if (!Number.isInteger(target) || target < tick) throw new RangeError('Capture ticks must increase.');
      while (tick < target) {
        for (const event of log) if (event.tick === tick) input(event);
        controller.advance(1 / 60); tick++;
      }
      controller.render();
      document.getElementById('details').textContent = `${width} × ${height} canvas · seed ${seed} · 60 Hz · tick ${tick}`;
      return stats();
    }
    window.capture = Object.freeze({ variant, surface, controller, canvas, log, options, stats, input, advanceTo, screenPoint });
    document.documentElement.dataset.ready = 'true';
  </script>
</body>
</html>
